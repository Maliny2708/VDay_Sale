<!DOCTYPE html>
<html>
<head>
  <title>Order Confirmed</title>
  <link rel="stylesheet" href="style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    .thankyou-card {
      background: var(--glass-bg);
      padding: 40px;
      border-radius: 25px;
      box-shadow: 0 20px 50px rgba(255, 111, 145, 0.15);
      max-width: 450px;
      margin: 0 auto;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(10px);
    }
   
    
    .summary-box {
      background: rgba(255, 240, 245, 0.9);
      padding: 20px;
      border-radius: 15px;
      margin: 20px 0;
      text-align: left;
    }
    .summary-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      color: #555;
    }
    
    .wa-btn {
      background: #25D366;
      color: white;
      text-decoration: none;
      padding: 15px;
      border-radius: 50px;
      display: block;
      margin-top: 10px;
      font-weight: bold;
      transition: transform 0.2s;
      cursor: pointer;
    }
    .wa-btn:hover { transform: translateY(-3px); }
  </style>
</head>
<body>

  <div class="nav">
      <span>Valentine's Day Sale</span>
    <a href="index.html">Home</a>
  </div>

  <div class="hero" style="background:none; min-height:100vh; padding-top:100px; padding-bottom:50px;">
    <div class="thankyou-card">
      
      <h1>Order Placed!</h1>
      <p>Thank you for your support!</p>

      <div class="summary-box">
        <div class="summary-row">
          <span>Order ID:</span>
          <strong id="dispOrderID">Loading...</strong>
        </div>
        
        <div class="summary-row" id="dispMMU" style="display:none; color:#ff6f91;">
          <span>Student Discount:</span>
          <strong>Applied (10%)</strong>
        </div>

        <div class="summary-row" style="border-top:1px solid rgba(0,0,0,0.1); margin-top:10px; padding-top:10px;">
          <span>Total:</span>
          <strong id="dispTotal" style="color:#ff6f91; font-size:1.2rem;">...</strong>
        </div>
      </div>

      <p style="font-size:0.9rem; color:#333; font-weight:bold; background:rgba(255,255,255,0.8); padding:10px; border-radius:10px; border:1px dashed #ccc;">
       <strong> Please screenshot this page </strong>        & send it to the WhatsApp chat!
      </p>
      
      <a id="waLink" target="_blank" class="wa-btn">
        Send to WhatsApp
      </a>
    </div>
  </div>

<script src="script.js"></script>
<script>showThankYou();</script>
</body>
</html>
