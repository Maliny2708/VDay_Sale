<!DOCTYPE html>
<html>
<head>
  <title>Menu - Malz Bakes</title>
  <link rel="stylesheet" href="style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>

  <div class="nav">

  </div>

  <div style="padding-top:100px; text-align:center;">
