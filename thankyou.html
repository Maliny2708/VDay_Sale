<!DOCTYPE html>
<html>
<head>
  <title>Order Confirmed | Malz Bakes</title>
  <link rel="stylesheet" href="style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    /* Specific styles for the "Cute" Thank You Card */
    .thankyou-card {
      background: white;
      padding: 40px;
      border-radius: 25px;
      box-shadow: 0 20px 50px rgba(255, 111, 145, 0.15);
      max-width: 450px;
      margin: 0 auto;
      text-align: center;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.8);
    }

    /* Cute Animated Checkmark */
    .checkmark-circle {
      width: 80px;
      height: 80px;
      background: #E5F9E8;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
    }
    .checkmark {
      font-size: 40px;
      color: #25D366;
      animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    /* Order Details Box */
    .order-box {
      background: #FFF0F5; /* Very light pink */
      border-radius: 15px;
      padding: 20px;
      margin: 25px 0;
      border: 1px dashed var(--pink);
    }
    
    .order-row {
      display: flex;
      justify-content: space-between;
      margin: 10px 0;
      font-size: 0.95rem;
      color: #555;
    }
    
    .order-row strong {
      color: #333;
    }

    /* WhatsApp Button Polish */
    .wa-btn {
      background: #25D366;
      color: white;
      text-decoration: none;
      padding: 15px 30px;
      border-radius: 50px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      box-shadow: 0 10px 20px rgba(37, 211, 102, 0.3);
      transition: transform 0.2s ease;
      width: 100%;
    }
    .wa-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 25px rgba(37, 211, 102, 0.4);
    }

    @keyframes popIn {
      0% { transform: scale(0); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="nav">
    <span>Malz Bakes ✨</span>
    <div>
      <a href="index.html">Home</a>
    </div>
  </div>

  <div class="hero" style="background: none; height: 100vh; padding-top: 80px;">
    
    <div class="thankyou-card">
      <div class="checkmark-circle">
        <span class="checkmark">✔</span>
      </div>

      <h1 style="font-size: 1.8rem; margin: 0 0 10px 0; color: #333;">Order Placed!</h1>
      <p style="color: #666; font-size: 0.95rem; line-height: 1.5;">
        Thank you for choosing <strong>Malz Bakes</strong>! 💖<br>
        Your Valentine's treats are almost yours.
      </p>

      <div class="order-box">
        <div class="order-row">
          <span>Order ID:</span>
          <strong id="dispOrderID">Loading...</strong>
        </div>
        <div class="order-row">
          <span>Total Amount:</span>
          <strong id="dispTotal" style="color: var(--pink); font-size: 1.1rem;">...</strong>
        </div>
      </div>

      <p style="font-size: 0.85rem; color: #888; margin-bottom: 20px;">
        To finalize your order, please send your payment proof via WhatsApp.
      </p>

      <a id="waLink" href="#" class="wa-btn">
        <span style="margin-right: 8px; font-size: 1.2rem;">📱</span>
        Confirm & Pay on WhatsApp
      </a>
      
      <div style="margin-top: 20px;">
        <a href="index.html" style="color: #999; text-decoration: none; font-size: 0.85rem;">← Back to Home</a>
      </div>

    </div>
  </div>

<script src="script.js"></script>
<script>
  // Ensure the script runs immediately to fill the data
  showThankYou();
</script>
</body>
</html>
