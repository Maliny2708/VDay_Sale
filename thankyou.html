<!DOCTYPE html>
<html>
<head>
  <title>Order Confirmed | Malz Bakes</title>
  <link rel="stylesheet" href="style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    .thankyou-card {
      background: white;
      padding: 40px;
      border-radius: 25px;
      box-shadow: 0 20px 50px rgba(255, 111, 145, 0.15);
      max-width: 450px;
      margin: 0 auto;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.8);
    }
    .checkmark-circle {
      width: 70px;
      height: 70px;
      background: #E5F9E8;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
    }
    .checkmark { font-size: 35px; color: #25D366; }
    .wa-btn {
      background: #25D366;
      color: white;
      text-decoration: none;
      padding: 15px;
      border-radius: 50px;
      display: block;
      margin-top: 20px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="nav">
    <span>Malz Bakes ✨</span>
    <a href="index.html">Home</a>
  </div>

  <div class="hero" style="background:none; height:100vh; padding-top:100px;">
    <div class="thankyou-card">
      <div class="checkmark-circle">
        <span class="checkmark">✔</span>
      </div>
      <h1>Order Placed!</h1>
      <p>Thank you for choosing Malz Bakes! 💖</p>

      <div style="background:#FFF0F5; padding:20px; border-radius:15px; margin:20px 0; text-align:left;">
        <p><strong>Order ID:</strong> <span id="dispOrderID">Loading...</span></p>
        <p><strong>Total:</strong> <span id="dispTotal" style="color:#ff6f91; font-weight:bold;">...</span></p>
      </div>

      <p style="font-size:0.9rem; color:#666;">Please confirm via WhatsApp to finalize.</p>
      
      <a id="waLink" href="#" class="wa-btn">
        📱 Confirm on WhatsApp
      </a>
    </div>
  </div>

<script src="script.js"></script>
<script>showThankYou();</script>
</body>
</html>
